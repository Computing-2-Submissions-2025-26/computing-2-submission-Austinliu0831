<!doctype html>
<html lang="en-gb">

<head>
    <meta charset="utf-8">

    <title>Simplified Ludo</title>

    <link rel="stylesheet" href="default.css">

    <link rel="icon" href="./assets/favicon.png">

    <script type="module" src="main.js"></script>
</head>

<body>

    <h1>Simplified Ludo</h1>

    <p id="current-player"></p>

    <section class="dice-panel" aria-label="Dice result">
        <p id="dice-value"></p>
        <div id="dice-face" aria-hidden="true"></div>
        <p id="status-text"></p>
    </section>

    <div id="board"></div>

    <p id="winner"></p>

    <button id="restart-button" aria-label="Restart game">
        Restart Game
    </button>

</body>

</html>
